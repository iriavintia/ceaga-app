<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>App socias CEAGA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Una sola columna de móvil, un solo tema claro (el encargo prohíbe modo oscuro). Estética del Prototipo B. */
:root{
  color-scheme:light;
  --bg:#F3F4F6;--card:#FFFFFF;--ink:#0F1A2A;--blue:#1D4ED8;--blue-d:#1E3A8A;--blue-s:#E8EEFC;
  --line:#E5E7EB;--line-2:#D1D5DB;--muted:#4B5563;--nav:#6B7280;
  --amber:#92400E;--amber-s:#FEF3E2;--green:#166534;--green-s:#E7F5EC;--green-l:#A7D7B8;
  --nv-1:#BFD0F5;--nv-2:#9FB3DA;--nv-3:#26354D;--nv-4:#DCE5F7;--ok:#22C55E;
  --desk:#D9DDE3;
  --display:'Space Grotesk',system-ui,sans-serif;--body:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
#root{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
button,input,select,textarea{font-family:var(--body);color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.demo-wrap{height:100%;display:flex;flex-direction:column;background:var(--desk)}
.demo-bar{flex-shrink:0;display:flex;justify-content:center;padding:8px 12px;background:var(--desk)}
.demo-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:#C7CDD6;width:100%;max-width:420px}
.demo-seg button{flex:1;min-width:0;min-height:44px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.demo-seg button.on{background:#fff;font-weight:700}
.demo-seg .n{min-width:20px;height:20px;border-radius:10px;background:#B45309;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.phone-area{flex:1;min-height:0;display:flex;justify-content:center}
.bo-frame{flex:1;min-height:0;width:100%;border:0;background:var(--bg);display:block}
@media (min-width:480px){
  .phone-area{padding:0 16px 16px}
  .phone{width:390px;height:100%;max-height:844px;border-radius:36px;box-shadow:0 18px 50px rgba(15,26,42,.22)}
}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:none}
.scroll::-webkit-scrollbar,.done-screen::-webkit-scrollbar{display:none}
.done-screen{scrollbar-width:none}
.pad{padding:20px 20px 28px;display:flex;flex-direction:column;gap:22px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;gap:12px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.base{align-items:baseline}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
h1{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.15;text-wrap:balance}
h2{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.2}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em}
.sub{font-size:14px;color:var(--muted);line-height:1.4}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.small{font-size:12px;color:var(--muted);line-height:1.4}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.t{font-size:15px;font-weight:600;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.big{border-radius:20px;padding:18px;gap:14px}
button.card{width:100%;text-align:left;font-size:14px}
.datebox{width:52px;flex-shrink:0;border-radius:12px;background:var(--blue-s);color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0}
.datebox .m{font-size:11px;font-weight:600}.datebox .d{font-family:var(--display);font-size:22px;font-weight:700}
.datebox.past{background:var(--bg);color:var(--muted)}
.datebox.warn{background:var(--amber-s);color:var(--amber)}
.tag{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.tag.formacion{background:var(--blue-s);color:var(--blue-d)}.tag.evento{background:var(--green-s);color:var(--green)}.tag.ayudas{background:var(--amber-s);color:var(--amber)}.tag.pasado{background:var(--bg);color:var(--muted)}
.count{font-size:12px;font-weight:700;color:var(--muted)}.count.warn{color:var(--amber)}
.ok-t{font-size:12px;font-weight:700;color:var(--green)}
.av{width:44px;height:44px;flex-shrink:0;border-radius:12px;color:#fff;font-family:var(--display);font-weight:700;display:flex;align-items:center;justify-content:center}
.av.round{border-radius:22px;background:var(--bg);color:#374151;font-family:var(--body)}
.av.me{border-radius:22px;background:var(--blue-s);color:var(--blue);font-family:var(--body)}
.btn{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--blue);background:var(--card);color:var(--blue);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.25}
.btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.white{background:#fff;border-color:#fff;color:var(--ink);font-weight:700}
.btn.ghost-n{background:transparent;border-color:#3B4A63;color:#fff}
.btn.grey{border-color:var(--line-2);color:var(--ink)}
.btn.done{background:var(--green-s);border-color:var(--green-l);color:var(--green)}
.btn.locked{background:var(--bg);border-color:var(--line-2);color:var(--muted)}
.btn.lg{min-height:52px;border-radius:26px;font-size:16px;font-weight:700;width:100%}
.btn.full{width:100%}
.link{min-height:44px;background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:14px;font-weight:600}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-size:13px;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.tema.on{background:var(--blue);border-color:var(--blue)}
.demo{min-height:44px;padding:0 12px;border:0;background:none;color:var(--nav);font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.demo.on{color:var(--amber);font-weight:700}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--nv-1)}
.hero .src{font-size:11px;color:var(--nv-2)}
.hero .hd{font-size:15px;font-weight:600;line-height:1.3}
.hero .rule{height:1px;background:var(--nv-3)}
.hero .link{color:#fff}
.hero .chip{background:transparent;border-color:#3B4A63;color:#fff}
.hero .chip.on{background:#fff;border-color:#fff;color:var(--ink)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px;scrollbar-width:none;scroll-padding:0 20px}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc(100% - 28px);scroll-snap-align:start;min-height:216px}
.slide .grow{flex:1}
.slide h3{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.slide p{font-size:13px;line-height:1.45;color:var(--nv-4)}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line-2)}
.dots i.on{background:var(--blue);width:18px}
.nav{flex-shrink:0;height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-top:8px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;height:60px;color:var(--nav);font-size:11px;font-weight:500}
.nav button.on{color:var(--blue);font-weight:700}
.head{background:var(--ink);color:#fff;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.head .link{color:#fff;align-self:flex-start}
.head .meta{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--nv-4)}
.video{width:100%;height:170px;border-radius:16px;border:1px solid var(--line-2);background:#E5E7EB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);font-size:13px;font-weight:600}
.video.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.segment{display:flex;background:var(--line);border-radius:14px;padding:4px}
.segment button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:500}
.segment button.on{background:#fff;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=email],input[type=search],select,textarea{width:100%;min-height:48px;border:1px solid var(--line-2);border-radius:14px;background:#fff;padding:0 14px;font-size:16px}
textarea{padding:12px 14px;min-height:84px;resize:none;line-height:1.4}
.inline{display:flex;gap:8px}.inline input{flex:1;min-width:0}.inline .btn{flex-shrink:0}
.err{font-size:13px;color:var(--amber);font-weight:600}
.pick{width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;min-height:72px}
.pick.on{border-color:var(--blue)}
.pick .box{margin-left:auto;width:26px;height:26px;flex-shrink:0;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff}
.pick.on .box{background:var(--blue);border-color:var(--blue)}
.me-box{border:2px solid var(--blue);background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.flow-top{padding:12px 20px 8px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.icon-b{width:44px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:flex-start}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bars i{height:4px;border-radius:2px;background:var(--line-2)}.bars i.on{background:var(--blue)}
.summary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.flow-foot{flex-shrink:0;padding:16px 20px 24px;background:var(--bg);border-top:1px solid var(--line)}
.done-screen{flex:1;min-height:0;overflow-y:auto;background:var(--ink);color:#fff;padding:24px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ticket{background:#fff;color:var(--ink);border-radius:24px;padding:20px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.check{width:56px;height:56px;border-radius:28px;background:var(--ok);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lines{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 16px}
.lines>div{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:56px;padding:8px 0;border-bottom:1px solid #F0F1F3}
.lines>div:last-child{border-bottom:0}
.lines b{font-size:14px;text-align:right;font-weight:700}
.rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rate button{min-height:48px;border-radius:14px;border:1px solid var(--line-2);background:#fff;font-family:var(--display);font-size:18px;font-weight:700}
.rate button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.notif{position:absolute;top:10px;left:10px;right:10px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 32px rgba(15,26,42,.28);animation:baja .25s ease-out}
@keyframes baja{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:40;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4;font-weight:500;box-shadow:0 8px 24px rgba(15,26,42,.3)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;line-height:1.3;color:var(--muted)}
.badge .ic{width:32px;height:32px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--nav)}
.badge.on{color:var(--ink);border-color:var(--green-l)}
.badge.on .ic{background:var(--green-s);color:var(--green)}
.plain{background:var(--line);border-radius:16px;padding:14px;font-size:13px;line-height:1.45}
.warnbox{background:var(--amber-s);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.empty{border:1px dashed #9CA3AF;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.45;color:#374151}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<style>
/* Añadidos tras el documento de CEAGA (nov 2026): 5 pestañas, accesos rápidos, networking, ecosistema, recursos */
.nav{grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{font-size:10.5px}
.bell{position:relative;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.bell .dot{position:absolute;top:4px;right:2px;min-width:18px;height:18px;border-radius:9px;background:#B45309;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qa-b{min-height:76px;border:1px solid var(--line);background:var(--card);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);padding:8px 4px}
.qa-i{width:36px;height:36px;border-radius:12px;background:var(--blue-s);color:var(--blue);display:grid;place-items:center}
.fuente{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.4}
.fuente svg{margin-top:1px}
.searchbox{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:0 14px;min-height:48px;color:var(--muted)}
.searchbox input{border:0!important;outline:none;padding:0!important;background:transparent;min-height:44px!important}
.tag.grupo{background:#F1EAFD;color:#5B21B6}
.tag.encuentro{background:#E0F2F1;color:#115E59}
.tag.net{background:var(--ink);color:#fff}
.tag.lock{background:var(--amber-s);color:var(--amber)}
.tag.informe{background:#EEF2F6;color:#334155}
.para-ti{color:var(--blue-d);font-weight:600}
.restr{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.08);border:1px solid #3B4A63;border-radius:14px;padding:12px;font-size:14px;line-height:1.4;color:var(--nv-4)}
.prog{display:flex;flex-direction:column;gap:8px}
.prog div{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px;line-height:1.4}
.prog b{font-family:var(--display);color:var(--blue)}
.pillco{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 4px;border:1px solid var(--line);background:#fff;border-radius:18px;font-size:13px;font-weight:600}
.mini{width:28px;height:28px;border-radius:14px;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.cap{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:600;color:#374151}
.locked-card{background:#F8FAFC;border-style:dashed}
.incoming{border:2px solid #F6C88F;background:var(--amber-s)}
.franjas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.franjas .chip{padding:0;min-height:44px}
.franjas .chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.notif-row{text-align:left}
.notif-row.unread{border-color:var(--blue)}
.unread-dot{width:10px;height:10px;border-radius:5px;background:var(--blue);flex-shrink:0;margin-top:6px}
.act-row{width:100%;background:none;border:0;border-bottom:1px solid #F0F1F3;padding:10px 0;min-height:56px;text-align:left}
.act-row:last-child{border-bottom:0}
.lines.kam b{font-size:13px;overflow-wrap:anywhere}
.lines.kam>div{min-height:44px}
.sw{all:unset;box-sizing:border-box;width:46px;height:28px;border-radius:14px;background:var(--line-2);padding:3px;display:flex;cursor:pointer;flex-shrink:0}
.sw::after{content:"";width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--blue)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sw:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- Personalización: destaca y ordena, nunca oculta ---------- */
function encaje(x, perfil) {
  const temas = (x.temas || []).filter(t => perfil.temas.includes(t));
  return { temas, cargo: (x.cargos || []).includes(perfil.cargo) };
}
const nota = (x, perfil) => { const e = encaje(x, perfil); return e.temas.length * 3 + (e.cargo ? 2 : 0); };
function motivo(x, perfil) {
  const { temas, cargo } = encaje(x, perfil);
  const n = temas.map(nombreTema);
  const lista = n.length > 1 ? n.slice(0, -1).join(', ') + ' y ' + n[n.length - 1] : n[0];
  if (cargo && n.length) return `Destacado porque eres de ${perfil.cargo} y te interesa ${lista}.`;
  if (n.length) return `Destacado porque te interesa ${lista}.`;
  if (cargo) return `Destacado por tu cargo: ${perfil.cargo}.`;
  return '';
}
function destacados(perfil) {
  const cand = [
    ...EVENTOS.filter(e => puedeAcceder(e, perfil)).map(e => ({ clase: 'evento', id: e.id, etiqueta: TIPO_TXT[e.tipo] + ' · ' + fCorta(e.fecha), titulo: e.titulo, cuando: e.plazo, x: e, cta: 'Ver y apuntarme' })),
    ...AYUDAS.filter(a => a.tipos.includes(perfil.tipo)).map(a => ({ clase: 'ayuda', id: a.id, etiqueta: 'Ayuda · cierra el ' + fCorta(a.plazo), titulo: a.titulo, cuando: a.plazo, x: a, cta: 'Ver la ayuda' })),
    ...INFORMES.filter(i => i.nuevo && puedeAcceder(i, perfil)).map(i => ({ clase: 'informe', id: i.id, etiqueta: 'Informe nuevo · ' + i.tipo, titulo: i.titulo, cuando: D(12, 31), x: i, cta: 'Leer el informe' }))
  ];
  return cand.sort((a, b) => nota(b.x, perfil) - nota(a.x, perfil) || a.cuando - b.cuando).slice(0, 3);
}

    abrirInscripcion: (id, paso) => setPantalla({ t: 'inscripcion', id, paso }),
    leerTodas: () => setNotifs(prev => prev.map(n => ({ ...n, leida: true }))),
    abrirNotif: n => { setNotifs(prev => prev.map(x => x.id === n.id ? { ...x, leida: true } : x)); const ir = n.ir || {}; if (ir.t === 'evento') setPantalla({ t: 'evento', id: ir.id, ancla: ir.ancla }); else if (ir.t === 'rec') { setPantalla(null); setSubRec(ir.sub); setTab('recursos'); } },
    confirmar: (id, datos) => {
      setInscritos(prev => ({ ...prev, [id]: datos }));
      const e = buscarEv(id);
      const gente = [{ persona: perfil.nombre, puesto: perfil.cargo + ' · ' + perfil.departamento, cargo: perfil.cargo },
        ...COMPAS.filter(c => datos.compas.includes(c.id)).map(c => ({ persona: c.nombre, puesto: c.rol, cargo: 'Otro' })),
        ...datos.invitados.map(m => ({ persona: m, puesto: 'Invitada por correo, sin cuenta', cargo: 'Otro' }))];
      aBackoffice('inscribir', id, perfil.empresa, gente, datos.networking);
      nuevaNotif({ ic: 'check', t: `Inscripción confirmada: ${e.titulo}`, ir: { t: 'evento', id } });
      /* Simulación: alguien inscrito pide una reunión a Iria poco después */
      if (datos.networking && NETWORKING[id]) {
        const cfg = NETWORKING[id];
        despues(6000, () => {
          const prev = rRef.current;
          const k = id + ':' + cfg.entrante;
          if (prev[k]) return;
          const libre = cfg.franjas.find(f => !Object.values(prev).some(r => r.ev === id && r.hora === f && r.estado !== 'rechazada')) || cfg.franjas[0];
          const p = persona(cfg.entrante);
          nuevaNotif({ ic: 'people', t: `${p.nombre} (${EMPRESAS[p.emp].nombre}) te pide una reunión a las ${libre}`, ir: { t: 'evento', id, ancla: 'networking' } });
          avisa(`${p.nombre} te ha pedido una reunión. Acéptala o recházala en el networking.`);
          aBackoffice('reunion', id, EMPRESAS[p.emp].nombre + ' · ' + p.nombre, perfil.empresa + ' · ' + perfil.nombre, libre, 'solicitada', 'Quiere hablar de la FP dual');
          setReuniones(pr => ({ ...pr, [k]: { ev: id, persona: cfg.entrante, hora: libre, estado: 'recibida', dir: 'in', nota: 'Quiere hablar de la FP dual y de cómo seleccionáis perfiles técnicos.' } }));
        });
      }
    },
    setNetworking: (id, on) => { setInscritos(prev => ({ ...prev, [id]: { ...prev[id], networking: on } })); avisa(on ? 'Ya apareces en el networking de este evento.' : 'Ya no apareces en el networking.'); aBackoffice('registro', `${perfil.empresa} ${on ? 'activa' : 'desactiva'} su perfil de networking en «${buscarEv(id).titulo}»`); },
    pedirReunion: (ev, pid, hora) => {
      const k = ev + ':' + pid;
      const p = persona(pid);
      setReuniones(prev => ({ ...prev, [k]: { ev, persona: pid, hora, estado: 'enviada', dir: 'out' } }));
      avisa(`Solicitud enviada a ${p.nombre} para las ${hora}. Te avisamos cuando responda.`);
      aBackoffice('reunion', ev, perfil.empresa + ' · ' + perfil.nombre, EMPRESAS[p.emp].nombre + ' · ' + p.nombre, hora, 'solicitada', '');
      /* Simulación: la otra persona acepta y la mesa se asigna sola */
      despues(4000, () => {
        const prev = rRef.current;
        if (!prev[k] || prev[k].estado !== 'enviada') return;
        const mesa = mesaLibre(ev, hora, pid, prev);
        nuevaNotif({ ic: 'people', t: `${p.nombre} ha aceptado tu reunión: ${hora}, mesa ${mesa}`, ir: { t: 'evento', id: ev, ancla: 'networking' } });
        avisa(`${p.nombre} ha aceptado. ${hora} · mesa ${mesa}. Ya está en tu agenda.`);
        aBackoffice('reunionEstado', ev, perfil.empresa + ' · ' + perfil.nombre, EMPRESAS[p.emp].nombre + ' · ' + p.nombre, 'aceptada', mesa);
        setReuniones(pr => ({ ...pr, [k]: { ...pr[k], estado: 'aceptada', mesa } }));
      });
    },
    responder: (k, si) => {
      const r = reuniones[k]; const p = persona(r.persona);
      const mesa = si ? mesaLibre(r.ev, r.hora, r.persona, reuniones) : null;
      aBackoffice('reunionEstado', r.ev, EMPRESAS[p.emp].nombre + ' · ' + p.nombre, perfil.empresa + ' · ' + perfil.nombre, si ? 'aceptada' : 'rechazada', mesa);
      avisa(si ? `Reunión con ${p.nombre} confirmada: ${r.hora}, mesa ${mesa}.` : `Has rechazado la reunión con ${p.nombre}.`);
      setReuniones(pr => ({ ...pr, [k]: { ...r, estado: si ? 'aceptada' : 'rechazada', mesa } }));
    },
    cancelar: id => { setInscritos(prev => { const n = { ...prev }; delete n[id]; return n; }); setReuniones(prev => { const n = {}; Object.entries(prev).forEach(([k, r]) => { if (r.ev !== id) n[k] = r; }); return n; }); avisa('Inscripción cancelada. La plaza pasa a otra empresa.'); aBackoffice('cancelar', id, perfil.empresa); },
    mostrarAviso: e => setNotif({ titulo: 'Mañana: ' + e.titulo, texto: `${e.hora.split(' ')[0]} · ${e.lugar}. Tu entrada QR está lista.`, cerrar: 'Entendido' }),
    quitarNotif: () => setNotif(null),
    lanzarDemo: () => {
      if (demo) { setDemo(null); setNotif(null); avisa('Modo demo apagado. Volvemos a hoy.'); return; }
      const mios = EVENTOS.filter(e => inscritos[e.id]);
      const ev = mios.length ? mios[0] : PASADOS[0];
      setDemo(ev.id);
      if (mios.length) { setAsistidos(a => a + 1); setCumplido(true); }
      setNotif({ titulo: 'Ayer estuviste en ' + ev.titulo, texto: 'Tres preguntas, un minuto. Con tu respuesta preparamos el siguiente.', accion: 'Responder', onAccion: () => { setNotif(null); setPantalla({ t: 'encuesta', id: ev.id }); }, cerrar: 'Ahora no' });
    }
  };

  let cuerpo, conNav = true;
  const P = pantalla && pantalla.t;
  if (P === 'evento') cuerpo = h(DetalleEvento, { id: pantalla.id, ctx, key: pantalla.id });
  else if (P === 'pasado') cuerpo = h(DetallePasado, { id: pantalla.id, ctx, key: pantalla.id });
  else if (P === 'empresa') cuerpo = h(DetalleEmpresa, { id: pantalla.id, ctx, key: pantalla.id });
  else if (P === 'actualidad') cuerpo = h(Actualidad, { ctx });
  else if (P === 'notifs') cuerpo = h(Notificaciones, { ctx });
  else if (P === 'inscripcion') { cuerpo = h(Inscripcion, { id: pantalla.id, inicio: pantalla.paso, ctx, key: pantalla.id + pantalla.paso }); conNav = false; }
  else if (P === 'encuesta') { cuerpo = h(Encuesta, { id: pantalla.id, ctx, key: pantalla.id }); conNav = false; }
  else if (P === 'registro') { cuerpo = h(Registro, { ctx }); conNav = false; }
  else {
    const V = { parati: ParaTi, agenda: Agenda, eco: Ecosistema, recursos: Recursos, espacio: MiEspacio }[tab];
    cuerpo = h('div', { className: 'scroll', key: tab }, h(V, { perfil, ctx }));
  }
  const TABS = [['parati', 'Para ti', 'home'], ['agenda', 'Agenda', 'cal'], ['eco', 'Ecosistema', 'eco'], ['recursos', 'Recursos', 'book'], ['espacio', 'Mi espacio', 'user']];
  const cambiarVista = v => { setVista(v); if (v === 'backoffice') setNuevas(0); };
  const movil = h('div', { className: 'phone' },
    notif && h('div', { className: 'notif', role: 'status' },
      h('div', { className: 'row', style: { alignItems: 'flex-start' } }, h('div', { style: { color: 'var(--blue)', flexShrink: 0 } }, h(Ic, { n: 'bell', s: 22 })), h('div', { className: 'stack-s' }, h('div', { className: 't' }, notif.titulo), h('div', { className: 'note' }, notif.texto))),
      h('div', { style: { display: 'flex', gap: 8 } },
        h('button', { className: 'btn grey', style: { flex: 1 }, onClick: () => setNotif(null) }, notif.cerrar),
        notif.accion && h('button', { className: 'btn solid', style: { flex: 1 }, onClick: notif.onAccion }, notif.accion))),
    cuerpo,
    toast && h('div', { className: 'toast', role: 'status' }, toast),
    conNav && h('nav', { className: 'nav', 'aria-label': 'Navegación principal' }, TABS.map(([id, t, ic]) => h('button', { key: id, className: tab === id ? 'on' : '', 'aria-current': tab === id ? 'page' : undefined, onClick: () => ctx.irTab(id) }, h(Ic, { n: ic, s: 24 }), t))));
  return h('div', { className: 'demo-wrap' },
    h('div', { className: 'demo-bar' }, h('div', { className: 'demo-seg', role: 'group', 'aria-label': 'Qué parte de la demo ver' },
      h('button', { className: vista === 'app' ? 'on' : '', 'aria-pressed': vista === 'app', onClick: () => cambiarVista('app') }, 'App de socias'),
      h('button', { className: vista === 'backoffice' ? 'on' : '', 'aria-pressed': vista === 'backoffice', onClick: () => cambiarVista('backoffice') }, 'Backoffice CEAGA', nuevas > 0 && h('span', { className: 'n', 'aria-label': nuevas + ' novedades desde la app' }, nuevas)))),
    h('div', { className: 'phone-area', hidden: vista !== 'app' }, movil),
    h('iframe', { id: 'bo-frame', className: 'bo-frame', title: 'Backoffice de CEAGA', srcDoc: backofficeHtml, hidden: vista !== 'backoffice' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>
